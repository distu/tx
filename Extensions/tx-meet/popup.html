<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1a1f2e;
      color: #e0e6f0;
    }
    .header {
      padding: 12px 14px 8px;
      border-bottom: 1px solid #2a3040;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #7eb8f7;
    }
    .header p {
      font-size: 11px;
      color: #8090a8;
      margin-top: 2px;
    }
    .section {
      padding: 10px 14px;
    }
    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5a6880;
      margin-bottom: 5px;
    }
    .value {
      font-size: 12px;
      color: #c8d8ec;
    }
    .participants-list {
      list-style: none;
      padding: 0;
    }
    .participants-list li {
      padding: 3px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 10px;
      border-top: 1px solid #2a3040;
      font-size: 11px;
      color: #5a6880;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6b7280;
    }
    .status-dot.active {
      background: #4ade80;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>tx Meet Bridge</h1>
    <p>Enviando dados para o app tx</p>
  </div>

  <div class="section" id="meetSection" style="display:none">
    <div class="label">Reunião</div>
    <div class="value" id="meetTitle">—</div>
  </div>

  <div class="section">
    <div class="label">Participantes (<span id="count">0</span>)</div>
    <ul class="participants-list" id="participantsList">
      <li style="color:#5a6880">Nenhuma reunião ativa</li>
    </ul>
  </div>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Aguardando reunião…</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
